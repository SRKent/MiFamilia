<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --ink: #f0ece0;
      --accent: #e8ff47;
      --mid: #2a2a2a;
      --danger: #ff4f4f;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 100;
      opacity: 0.6;
    }

    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--mid) 1px, transparent 1px),
        linear-gradient(90deg, var(--mid) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.35;
      pointer-events: none;
    }

    .corner {
      position: fixed;
      width: 28px;
      height: 28px;
      border-color: var(--accent);
      border-style: solid;
      opacity: 0.7;
      z-index: 10;
    }
    .corner--tl { top: 24px; left: 24px; border-width: 2px 0 0 2px; }
    .corner--tr { top: 24px; right: 24px; border-width: 2px 2px 0 0; }
    .corner--bl { bottom: 24px; left: 24px; border-width: 0 0 2px 2px; }
    .corner--br { bottom: 24px; right: 24px; border-width: 0 2px 2px 0; }

    /* LOGIN SCREEN */
    #login-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #login-screen.hide {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }

    .login-label {
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.2s forwards;
    }

    .login-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: 0.04em;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.35s forwards;
    }

    .input-wrap {
      position: relative;
      width: min(340px, 88vw);
      opacity: 0;
      animation: fadeUp 0.5s ease 0.5s forwards;
    }

    .input-wrap input {
      width: 100%;
      background: transparent;
      border: 1px solid #333;
      border-bottom: 2px solid var(--accent);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      padding: 0.75rem 3rem 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s;
      caret-color: var(--accent);
    }
    .input-wrap input::placeholder { color: #444; }
    .input-wrap input:focus { border-color: var(--accent); background: rgba(232,255,71,0.03); }
    .input-wrap input.error { border-color: var(--danger); animation: shake 0.35s ease; }

    .input-wrap button {
      position: absolute;
      right: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
      font-size: 1.1rem;
      padding: 0.3rem;
      line-height: 1;
      transition: opacity 0.2s;
    }
    .input-wrap button:hover { opacity: 0.7; }

    .error-msg {
      margin-top: 0.75rem;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--danger);
      min-height: 1em;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .error-msg.visible { opacity: 1; }

    .hint {
      margin-top: 2.5rem;
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      color: #3a3a3a;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.7s forwards;
    }

    /* MAIN PAGE */
    #main-page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease 0.3s;
    }
    #main-page.show {
      opacity: 1;
      pointer-events: auto;
    }

    .tag {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.8rem;
    }

    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 18vw, 16rem);
      line-height: 0.88;
      letter-spacing: -0.01em;
      text-align: center;
    }
    .headline span { display: block; }
    .headline span:nth-child(2) { color: var(--accent); }

    .divider {
      width: 100%;
      max-width: 600px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--ink), transparent);
      margin: 2rem 0;
    }

    .sub {
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #888;
    }

    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      background: var(--accent);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 1s step-end infinite;
    }

    .stamp {
      position: fixed;
      bottom: 28px;
      right: 32px;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: #444;
      text-transform: uppercase;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-6px); }
      40%     { transform: translateX(6px); }
      60%     { transform: translateX(-4px); }
      80%     { transform: translateX(4px); }
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <!-- LOGIN -->
  <div id="login-screen">
    <p class="login-label">— access required —</p>
    <h2 class="login-title">Enter Passphrase</h2>
    <div class="input-wrap">
      <input
        id="passphrase-input"
        type="password"
        placeholder="••••••••••••"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="submit-btn" title="Submit">&#x2192;</button>
    </div>
    <p class="error-msg" id="error-msg">incorrect passphrase</p>
    <p class="hint">change the passphrase in the script below</p>
  </div>

  <!-- MAIN PAGE -->
  <main id="main-page">
    <p class="tag">— transmission incoming —</p>
    <h1 class="headline">
      <span>Hello</span>
      <span>World</span>
    </h1>
    <div class="divider"></div>
    <p class="sub">your page is live<span class="cursor"></span></p>
  </main>

  <div class="stamp">hosted on github pages</div>

  <script>
    // ── Change this to your desired passphrase ──
    const PASSPHRASE = "opensesame";
    // ────────────────────────────────────────────

    const input       = document.getElementById("passphrase-input");
    const btn         = document.getElementById("submit-btn");
    const errorMsg    = document.getElementById("error-msg");
    const loginScreen = document.getElementById("login-screen");
    const mainPage    = document.getElementById("main-page");

    function attempt() {
      if (input.value === PASSPHRASE) {
        loginScreen.classList.add("hide");
        setTimeout(() => {
          loginScreen.style.display = "none";
          mainPage.classList.add("show");
        }, 650);
      } else {
        input.classList.add("error");
        errorMsg.classList.add("visible");
        input.value = "";
        setTimeout(() => input.classList.remove("error"), 400);
      }
    }

    btn.addEventListener("click", attempt);
    input.addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });
    input.focus();
  </script>
</body>
</html>
