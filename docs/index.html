<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --ink: #f0ece0;
      --accent: #e8ff47;
      --mid: #2a2a2a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 100;
      opacity: 0.6;
    }

    .scene {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 2rem;
    }

    /* Decorative grid lines */
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--mid) 1px, transparent 1px),
        linear-gradient(90deg, var(--mid) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.35;
      pointer-events: none;
    }

    /* Corner markers */
    .corner {
      position: fixed;
      width: 28px;
      height: 28px;
      border-color: var(--accent);
      border-style: solid;
      opacity: 0.7;
    }
    .corner--tl { top: 24px; left: 24px; border-width: 2px 0 0 2px; }
    .corner--tr { top: 24px; right: 24px; border-width: 2px 2px 0 0; }
    .corner--bl { bottom: 24px; left: 24px; border-width: 0 0 2px 2px; }
    .corner--br { bottom: 24px; right: 24px; border-width: 0 2px 2px 0; }

    /* Tag label */
    .tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.8rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.2s forwards;
    }

    /* Big headline */
    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 18vw, 16rem);
      line-height: 0.88;
      letter-spacing: -0.01em;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .headline span {
      display: block;
      opacity: 0;
      transform: translateY(60px);
    }
    .headline span:nth-child(1) { animation: slideUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.4s forwards; }
    .headline span:nth-child(2) {
      color: var(--accent);
      animation: slideUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.55s forwards;
    }

    /* Divider */
    .divider {
      width: 100%;
      max-width: 600px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--ink), transparent);
      margin: 2rem 0;
      opacity: 0;
      animation: fadeIn 0.8s ease 1s forwards;
    }

    /* Sub-line */
    .sub {
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #888;
      opacity: 0;
      animation: fadeUp 0.6s ease 1.1s forwards;
    }

    /* Blinking cursor */
    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      background: var(--accent);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 1s step-end infinite;
    }

    /* Footer stamp */
    .stamp {
      position: fixed;
      bottom: 28px;
      right: 32px;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: #444;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1s ease 1.6s forwards;
    }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <main class="scene">
    <p class="tag">— transmission incoming —</p>
    <h1 class="headline">
      <span>Hello</span>
      <span>World</span>
    </h1>
    <div class="divider"></div>
    <p class="sub">your page is live<span class="cursor"></span></p>
  </main>

  <div class="stamp">hosted on github pages</div>
</body>
</html>
